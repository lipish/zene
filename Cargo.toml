[workspace]
members = [
    "apps/cli",
    "apps/inference-gateway",
    "crates/config",
    "crates/llm",
    "crates/sandbox",
    "crates/tools",
    "crates/session",
    "crates/context",
    "crates/core",
    "crates/model-executor",
    "crates/runtime",
    "crates/agent-runtime",
    "crates/mcp",
    "crates/hooks",
    "crates/permission",
    "crates/turn",
    "crates/workspace",
    "crates/index",
]
resolver = "2"

[workspace.package]
version = "0.1.16"
edition = "2021"
license = "MIT"
authors = ["Zene Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
cellz = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
tower-http = { version = "0.6", features = ["trace"] }
jsonschema = "0.26"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
parking_lot = "0.12"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zene-config = { version = "0.1.12", path = "crates/config" }
zene-context = { version = "0.1.12", path = "crates/context" }
zene-core = { path = "crates/core" }
zene-llm = { version = "0.1.12", path = "crates/llm" }
zene-sandbox = { path = "crates/sandbox" }
zene-session = { version = "0.1.12", path = "crates/session" }
zene-tools = { path = "crates/tools" }
zene-mcp = { path = "crates/mcp" }
zene-model-executor = { version = "0.1.14", path = "crates/model-executor" }
zene-runtime = { path = "crates/runtime" }
zene-agent-runtime = { path = "crates/agent-runtime" }
zene-hooks = { path = "crates/hooks" }
zene-permission = { version = "0.1.12", path = "crates/permission" }
zene-turn = { path = "crates/turn" }
zene-workspace = { path = "crates/workspace" }
zene-index = { path = "crates/index" }
unigateway-sdk = { version = "2.15.1", default-features = false, features = ["core"] }
unigateway-session = { version = "2.15.1" }
unigateway-session-redis = { version = "2.15.1" }
llm_providers = "0.12.0"
tiktoken-rs = "0.12"

[patch.crates-io]
eero-keel-core = { git = "https://github.com/EeroEternal/keel" }
eero-keel-enforce = { git = "https://github.com/EeroEternal/keel" }
eero-keel-policy = { git = "https://github.com/EeroEternal/keel" }
eero-keel-record = { git = "https://github.com/EeroEternal/keel" }
